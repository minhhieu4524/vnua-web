<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo</title>
    <style>
        body {
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            line-height: 1.6;
        }
        .demo-box {
            border: 1px solid #ccc;
            padding: 12px;
        }

        .demo-box input {
            padding: 6px 8px;
            width: 200%;
            max-width: 100%;
        }

        #ds {
            list-style: none;
            padding: 0;
            margin: 10px 0 0;

        }

        #ds li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #eee;
        padding: 8px 0;
        }
        #ds button {
            cursor: pointer;
        }

    </style>
</head>
<body>
    <div class="demo-box">
        <form id="form">
            <label for="o-ten">Tên món:</label>
            <input type="text" name="" id ="o-ten" placeholder="pizza" />
            <button type="submit">Thêm món</button>
        </form>
        <ul id="ds"></ul>
        <div>
            
            <script>
                const form = document.querySelector("#form");
                const oTen = document.querySelector("#o-ten"); 
                const ds = document.querySelector("#ds");

                form.addEventListener("submit", (e) => {
                    e.preventDefault(); //không để trang load lại
                    const ten = oTen.value.trim();
                    if (ten ==="") return; //ten null bỏ qua

                    //tạo dòng mới
                    const li = document.createElement("li");

                    //tên món ăn

                    const span = document.createElement("span");
                    span.textContent = ten;

                    const nutXoa = document.createElement("button");
                    nutXoa.type = "button"; //không submit form
                    nutXoa.textContent = "Xóa";
                    nutXoa.addEventListener("click", () => {
                        li.remove();
                    });
                    //ghép vào li rồi gán vào danh sách
                    li.append(span, nutXoa);
                    ds.append(li);

                    oTen.value = ""; //xóa nội dung ô input
                    oTen.focus(); //sẵn sàng nhập món ăn tiếp theo
                });

            </script>
        </div>
</body>
</html>
