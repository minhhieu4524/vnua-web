<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=, initial-scale=1.0"
    />
    <title>Document</title>
  </head>
  <body>
    <input type ="password" id="mat-khau" value="Nongsan@2026" />
    <button type="button" id="btn-mat-khau">Hiện</button>
    <script>
        debugger;
        //logic show/hide password

        const oMatkhau = document.querySelector("#mat-khau");
        console.log(oMatkhau, "oMatkhau");
        const nut = document.querySelector("#btn-mat-khau");
        console.log(nut, "nut");
        nut.addEventListener("click", () => {
            const dangAn = oMatkhau.type === "password";
            oMatkhau.type = dangAn ? "text" : "password";
            nut.textContent = dangAn ? "Ẩn" : "Hiện";
        });
    </script>
  </body>
</html>
